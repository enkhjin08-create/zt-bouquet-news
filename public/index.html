<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Зөвхөн түүнд">
<meta property="og:url" content="https://bouquet.zuvhuntuund.com/">
<meta property="og:title" content="Түүнд зориулсан сонин баглаа · Зөвхөн түүнд">
<meta property="og:description" content="Зураг, сэтгэлийн үгээ оруулаад өөрийн сонинтой цэцгийн баглаа захиалаарай.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta property="og:locale" content="mn_MN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bouquet.zuvhuntuund.com/og.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%237a2e3d'/><path d='M32 50C18 40 14 32 16 25c2-7 11-8 16-1 5-7 14-6 16 1 2 7-2 15-16 25z' fill='%23fff7f3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Manrope:wght@400;600;700&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&family=Oswald:wght@700&family=PT+Mono&family=Rubik:wght@900&family=Playfair+Display:ital,wght@0,800;1,900&family=Poiret+One&display=swap">
<link rel="stylesheet" href="sheet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="wrap" id="main">
  <header class="top">
    <div>
      <div class="brand">Зөвхөн түүнд</div>
      <h1>Түүнд зориулсан сонин баглаа</h1>
      <p>Зураг, сэтгэлийн үгээ оруулаарай. Бид A3 цаасан дээр хэвлээд, цэцгийн баглаагаа ороож бэлдэнэ.</p>
    </div>
  </header>
  <div class="editor" id="editor"></div>
  <div class="submit-bar">
    <div class="paym" role="radiogroup" aria-label="Төлбөрийн хэлбэр">
      <label class="dl-opt on"><input type="radio" name="paym" value="qpay" checked><span>QPay</span></label>
      <label class="dl-opt"><input type="radio" name="paym" value="bank"><span>Дансаар шилжүүлэх</span></label>
    </div>
    <button class="btn" id="submit" type="button">Захиалга илгээх</button>
    <p id="submit-note">Төлбөр баталгаажмагц бид сонин, баглааг тань бэлдэж эхэлнэ.</p>
  </div>
</main>
<script type="module">
import { createEditor, toast, money, loadCatalog } from "./app.js";
import { TEMPLATES } from "./render.js";
const ed = createEditor({ root: document.getElementById("editor"), mode: "customer", onChange: updateBtn, footer: document.querySelector(".submit-bar") });
const btn = document.getElementById("submit");
const main = document.getElementById("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const payMethod = () => document.querySelector("input[name=paym]:checked")?.value || "qpay";
document.querySelector(".paym").addEventListener("change", () => {
  document.querySelectorAll(".paym .dl-opt").forEach((l) => l.classList.toggle("on", l.querySelector("input").checked));
  updateBtn();
});
function updateBtn() {
  const p = ed.price();
  btn.textContent = !p.total ? "Захиалга илгээх" : payMethod() === "bank" ? `Захиалаад данс руу шилжүүлэх · ${money(p.total)}` : `Захиалаад QPay-ээр төлөх · ${money(p.total)}`;
}
async function bankScreen(id, phone, total) {
  const c = (await loadCatalog()) || {};
  const ref = `${id} ${phone}`.replace(/[^0-9A-Za-z ]/g, "").trim();
  const row = (label, val, copy = true) => `<div class="bk-row"><span>${label}</span><b>${esc(val)}</b>${copy ? `<button type="button" class="link" data-copy="${esc(val)}">Хуулах</button>` : ""}</div>`;
  main.innerHTML = `
    <div class="pay">
      <div class="brand">Зөвхөн түүнд · № ${esc(id)}</div>
      <h2>Дансаар шилжүүлэх</h2>
      <p class="pay-amt">${money(total)}</p>
      <div class="bk">
        ${row("Банк", c.bankName || "", false)}
        ${row("Дансны дугаар", c.bankAccount || "")}
        ${row("Хүлээн авагч", c.bankHolder || "", false)}
        ${row("Дүн", String(total))}
        ${row("Гүйлгээний утга", ref)}
      </div>
      <p class="pay-hint">Гүйлгээний утга дээр захиалгын дугаараа заавал бичээрэй. Төлбөр орж ирснийг шалгаад бид сонин, баглааг тань бэлдэж эхэлнэ.</p>
      <p class="pay-hint">Асуух зүйл байвал Instagram DM-ээр <b>№ ${esc(id)}</b> дугаараа хэлээрэй.</p>
    </div>`;
  main.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Хуулсан ✓"; } catch { toast("Хуулж чадсангүй. Гараар хуулна уу.", "err"); }
  });
  window.scrollTo(0, 0);
}
updateBtn();

function done(id, phone, paid) {
  main.innerHTML = `
    <div class="done">
      <div class="brand">Зөвхөн түүнд</div>
      <h2>${paid ? "Төлбөр амжилттай" : "Захиалга хүлээн авлаа"}</h2>
      <p>Таны захиалгын дугаар</p>
      <div class="code">№ ${esc(id)}</div>
      <p>${paid ? "Баярлалаа! Бид сонин, баглааг тань бэлдэж эхэллээ." : "Бид удахгүй"} ${paid ? "" : `<b>${esc(phone)}</b> дугаарт холбогдоно.`}</p>
      <p>Асуух зүйл байвал Instagram DM-ээр энэ дугаараа хэлээрэй.</p>
    </div>`;
  window.scrollTo(0, 0);
}

async function payScreen(id, phone, inv) {
  const isMobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  main.innerHTML = `
    <div class="pay">
      <div class="brand">Зөвхөн түүнд · № ${esc(id)}</div>
      <h2>QPay-ээр төлөх</h2>
      <p class="pay-amt">${money(inv.amount)}</p>
      ${inv.qr ? `<img class="pay-qr" alt="QPay QR код" src="data:image/png;base64,${inv.qr}">` : ""}
      <p class="pay-hint">${isMobile ? "Банкны аппаа сонгоод төлнө үү." : "Банкны аппаараа QR кодыг уншуулж төлнө үү."}</p>
      ${inv.urls?.length ? `<div class="banks">${inv.urls.map((u) => `<a class="bank" href="${esc(u.link)}"><img src="${esc(u.logo)}" alt="" loading="lazy"><span>${esc(u.description || u.name)}</span></a>`).join("")}</div>` : ""}
      <p class="pay-status" id="pay-status"><span class="spin"></span>Төлбөр хүлээж байна…</p>
      <button type="button" class="btn secondary" id="pay-check">Төлсөн, шалгах</button>
    </div>`;
  window.scrollTo(0, 0);
  const st = document.getElementById("pay-status");
  let stop = false;
  const check = async () => {
    try {
      const r = await fetch(`/api/pay/${id}`, { cache: "no-store" }).then((x) => x.json());
      if (r.paid) { stop = true; done(id, phone, true); return true; }
    } catch {}
    return false;
  };
  document.getElementById("pay-check").addEventListener("click", async () => {
    st.textContent = "Шалгаж байна…";
    if (!(await check())) st.innerHTML = `<span class="spin"></span>Төлбөр одоогоор ирээгүй байна. Төлсний дараа хэдэн секунд хүлээгээрэй.`;
  });
  const t0 = Date.now();
  while (!stop && Date.now() - t0 < 20 * 60 * 1000) {
    await new Promise((r) => setTimeout(r, 4000));
    if (document.hidden) continue;
    if (await check()) return;
  }
}

btn.addEventListener("click", async () => {
  const o = ed.get();
  if ((TEMPLATES[o.template]?.photos.length || 0) > 0 && !o.photos.some((p) => p.src)) { toast("Дор хаяж нэг зураг оруулна уу.", "err"); return; }
  if (o.delivery?.type === "delivery" && !o.delivery.address.trim()) { toast("Хүргэлтийн хаягаа бичнэ үү.", "err"); document.getElementById("d-addr")?.focus(); return; }
  if (ed.needsPin?.()) { toast("Хүргэлтийн байршлаа газрын зураг дээр тэмдэглэнэ үү.", "err"); document.getElementById("dl-map")?.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
  if (!o.contact.phone.trim()) { toast("Утасны дугаараа оруулна уу.", "err"); document.getElementById("c-phone")?.focus(); return; }
  btn.disabled = true; btn.textContent = "Илгээж байна…";
  try {
    const method = payMethod();
    const res = await fetch("/api/orders", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...o, payMethod: method }) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Илгээж чадсангүй. Дахин оролдоно уу.");
    const phone = o.contact.phone;
    if (method === "bank" && data.price?.total) { bankScreen(data.id, phone, data.price.total); return; }
    if (!data.qpay || !data.price?.total) { done(data.id, phone, false); return; }
    btn.textContent = "QPay нэхэмжлэх үүсгэж байна…";
    const pr = await fetch(`/api/pay/${data.id}`, { method: "POST" });
    const inv = await pr.json().catch(() => ({}));
    if (!pr.ok) { toast(inv.error || "Төлбөрийн холбоос үүсгэж чадсангүй. Бид тантай холбогдоно.", "err"); done(data.id, phone, false); return; }
    if (inv.paid) { done(data.id, phone, true); return; }
    payScreen(data.id, phone, inv);
  } catch (e) {
    toast(e.message, "err");
    btn.disabled = false; updateBtn();
  }
});
</script>
</body>
</html>
